<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProofPnL — zkTLS-Verified Binance Spot PnL</title>
    <meta name="description" content="Generate a cryptographically verified proof of your Binance Spot PnL Rate using Primus zkTLS. Your credentials and trades never leave your session." />
    <meta property="og:title" content="ProofPnL — zkTLS-Verified Binance Spot PnL" />
    <meta property="og:description" content="Prove your trading performance without revealing your credentials. Powered by Primus Network zkTLS." />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Inline theme script — runs synchronously before any paint.
      Reads the saved theme from localStorage and applies data-theme to <html>
      so CSS variables are correct from the very first frame (no flash).
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ppnl_theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* storage unavailable (private browsing etc.) */ }
      })();
    </script>

    <!-- Fonts: Manrope (body/display) + IBM Plex Mono (attestation metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon: Primus orange circle -->

    />
